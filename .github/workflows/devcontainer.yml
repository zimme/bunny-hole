name: Dev Container prebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - "compose.yaml"
      - ".tool-versions"
      - "deno.json"
      - "deno.lock"
      - "apps/**/deno.json"
      - "packages/**/deno.json"
      - "fixtures/**/deno.json"
      - ".github/workflows/devcontainer.yml"

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve the immutable commit image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
        run: |
          if output="$(docker manifest inspect "$IMAGE" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$output" in
            *"manifest unknown"*|*"no such manifest"*|*"not found"*)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unable to determine whether $IMAGE already exists" >&2
              echo "$output" >&2
              exit 1
              ;;
          esac
      - name: Publish immutable and cache tags
        if: steps.image.outputs.exists != 'true'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          imageTag: ${{ github.sha }},cache
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: always
