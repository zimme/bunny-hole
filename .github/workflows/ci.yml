name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate in the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          runCmd: CI=true deno task validate
      - name: Diagnose Dev Container startup
        if: failure()
        run: |
          docker compose --profile development ps --all
          docker compose --profile development logs --no-color docker-engine
