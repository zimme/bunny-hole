name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Dev Container Dockerfile is generated outside the checkout. Use Compose
# directly so Bake does not reject those generated paths.
env:
  COMPOSE_BAKE: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUNNY_HOLE_ENVIRONMENT_NAME: ci-validation
      COMPOSE_PARALLEL_LIMIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rootlesskit-apparmor
      - name: Initialize Compose workspace
        run: sh .devcontainer/initialize.sh
      - name: Validate in the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          env: |
            CI
            BUNNY_HOLE_ENVIRONMENT_NAME
            COMPOSE_PARALLEL_LIMIT
          runCmd: deno task validate
      - name: Diagnose validation failure
        if: failure()
        run: bash .devcontainer/diagnose.sh
      - name: Tear down validation environment
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --profile development down --volumes --remove-orphans
          fi

  windows-state:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.5
      - name: Install frozen dependencies
        run: deno ci
      - name: Test Windows configuration replacement and recovery
        run: >-
          deno test --allow-env --allow-read --allow-write
          tests/session_state_test.ts tests/state_recovery_test.ts
