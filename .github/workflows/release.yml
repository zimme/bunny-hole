name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate SemVer tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          previous="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | sort -V | tail -1)"
          if [[ -n "$previous" ]]; then
            [[ "$(printf '%s\n' "$previous" "$TAG" | sort -V | tail -1)" == "$TAG" ]]
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the authoritative validation
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          runCmd: CI=true deno task validate
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish relay
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: relay-runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-relay:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-relay:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-relay:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-relay:buildcache,mode=max
          sbom: true
          provenance: mode=max
      - name: Smoke exact published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}-relay@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" != "0"
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" != "root"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}-relay@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: bunny-hole-relay-${{ github.ref_name }}.spdx.json
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-relay
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest-sbom@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}-relay
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: bunny-hole-relay-${{ github.ref_name }}.spdx.json
          push-to-registry: true
      - name: Generate Conventional Commit release notes
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          range="${previous:+${previous}..}HEAD"
          {
            echo "## Changes"
            git log "$range" --format='- %s (%h)' --grep='^\(feat\|fix\|docs\|perf\|refactor\)(\|^\(feat\|fix\|docs\|perf\|refactor\):'
            echo
            echo "## Relay image"
            echo '```text'
            echo "ghcr.io/${GITHUB_REPOSITORY}-relay@${DIGEST}"
            echo '```'
          } > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          bunny-hole-relay-${{ github.ref_name }}.spdx.json
          --verify-tag --title "Bunny Hole ${{ github.ref_name }}"
          --notes-file release-notes.md
