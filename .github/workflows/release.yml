name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

# The Dev Container Dockerfile is generated outside the checkout. Use Compose
# directly so Bake does not reject those generated paths.
env:
  COMPOSE_BAKE: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Release
    env:
      BUNNY_HOLE_ENVIRONMENT_NAME: release-validation
      COMPOSE_PARALLEL_LIMIT: "1"
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate ComVer tag shape
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.0(-rc\.[1-9][0-9]*)?$ ]] || {
            echo "ComVer releases use MAJOR.MINOR.0 or MAJOR.MINOR.0-rc.N" >&2
            exit 1
          }
      - name: Require a reviewed default-branch commit
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/rootlesskit-apparmor
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize Compose workspace
        run: sh .devcontainer/initialize.sh
      - name: Run the authoritative validation
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          env: |
            CI
            BUNNY_HOLE_ENVIRONMENT_NAME
            COMPOSE_PARALLEL_LIMIT
            RELEASE_TAG
          runCmd: >-
            deno task validate &&
            deno task release:check "$RELEASE_TAG" &&
            deno task release:artifacts
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Refuse to overwrite released OCI versions
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for image in \
            "ghcr.io/${GITHUB_REPOSITORY}-host:${VERSION}" \
            "ghcr.io/${GITHUB_REPOSITORY}-connector:${VERSION}"; do
            if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              echo "Refusing to overwrite released image $image" >&2
              exit 1
            fi
            case "$output" in
              *"manifest unknown"*|*"not found"*) ;;
              *)
                echo "Unable to prove that $image is unpublished" >&2
                echo "$output" >&2
                exit 1
                ;;
            esac
          done
      - name: Build and publish host
        id: host
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: host-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-host:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-host:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-host:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-host:buildcache,mode=max
          sbom: true
          provenance: mode=max
      - name: Build and publish connector
        id: connector
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: connector-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-connector:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-connector:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-connector:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-connector:buildcache,mode=max
          sbom: true
          provenance: mode=max
      - name: Smoke exact published digests
        env:
          HOST_IMAGE: ghcr.io/${{ github.repository }}-host@${{ steps.host.outputs.digest }}
          CONNECTOR_IMAGE: ghcr.io/${{ github.repository }}-connector@${{ steps.connector.outputs.digest }}
        run: |
          for image in "$HOST_IMAGE" "$CONNECTOR_IMAGE"; do
            docker pull "$image"
            test "$(docker inspect --format '{{.Config.User}}' "$image")" != "0"
            test "$(docker inspect --format '{{.Config.User}}' "$image")" != "root"
          done
          docker run --rm "$CONNECTOR_IMAGE" --version
      - name: Exercise the exact published images end to end
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          BUNNY_HOLE_HOST_IMAGE: ghcr.io/${{ github.repository }}-host@${{ steps.host.outputs.digest }}
          BUNNY_HOLE_CONNECTOR_IMAGE: ghcr.io/${{ github.repository }}-connector@${{ steps.connector.outputs.digest }}
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          env: |
            CI
            BUNNY_HOLE_ENVIRONMENT_NAME
            COMPOSE_PARALLEL_LIMIT
            BUNNY_HOLE_HOST_IMAGE
            BUNNY_HOLE_CONNECTOR_IMAGE
          runCmd: deno task integration
      - name: Generate host SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}-host@${{ steps.host.outputs.digest }}
          format: spdx-json
          output-file: dist/release/bunny-hole-host-${{ github.ref_name }}.spdx.json
      - name: Generate connector SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}-connector@${{ steps.connector.outputs.digest }}
          format: spdx-json
          output-file: dist/release/bunny-hole-connector-${{ github.ref_name }}.spdx.json
      - name: Attest host image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-host
          subject-digest: ${{ steps.host.outputs.digest }}
          push-to-registry: true
      - name: Attest connector image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-connector
          subject-digest: ${{ steps.connector.outputs.digest }}
          push-to-registry: true
      - name: Attest host SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}-host
          subject-digest: ${{ steps.host.outputs.digest }}
          sbom-path: dist/release/bunny-hole-host-${{ github.ref_name }}.spdx.json
          push-to-registry: true
      - name: Attest connector SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}-connector
          subject-digest: ${{ steps.connector.outputs.digest }}
          sbom-path: dist/release/bunny-hole-connector-${{ github.ref_name }}.spdx.json
          push-to-registry: true
      - name: Package the version-bound deployment template
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          env: |
            RELEASE_TAG
            RELEASE_COMMIT=${{ github.sha }}
            RELEASE_REPOSITORY=${{ github.repository }}
            HOST_DIGEST=${{ steps.host.outputs.digest }}
            CONNECTOR_DIGEST=${{ steps.connector.outputs.digest }}
          runCmd: deno task release:deployment-template
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/*
      - name: Publish the connector library to JSR
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          # Forward only the short-lived OIDC request and public provenance inputs.
          inheritEnv: false
          env: |
            CI
            BUNNY_HOLE_ENVIRONMENT_NAME
            COMPOSE_PARALLEL_LIMIT
            RELEASE_TAG
            ACTIONS_ID_TOKEN_REQUEST_URL
            ACTIONS_ID_TOKEN_REQUEST_TOKEN
            GITHUB_ACTIONS
            GITHUB_EVENT_NAME
            GITHUB_REF
            GITHUB_REPOSITORY
            GITHUB_REPOSITORY_ID
            GITHUB_REPOSITORY_OWNER_ID
            GITHUB_RUN_ATTEMPT
            GITHUB_RUN_ID
            GITHUB_SERVER_URL
            GITHUB_SHA
            GITHUB_WORKFLOW_REF
            RUNNER_ENVIRONMENT
          runCmd: deno task release:publish-package
      - name: Generate Conventional Commit release notes
        env:
          HOST_DIGEST: ${{ steps.host.outputs.digest }}
          CONNECTOR_DIGEST: ${{ steps.connector.outputs.digest }}
        run: |
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          range="${previous:+${previous}..}HEAD"
          {
            echo "## Changes"
            git log "$range" --format='- %s (%h)' --grep='^\(feat\|fix\|docs\|perf\|refactor\)(\|^\(feat\|fix\|docs\|perf\|refactor\):'
            echo
            echo "## OCI images"
            echo '```text'
            echo "ghcr.io/${GITHUB_REPOSITORY}-host@${HOST_DIGEST}"
            echo "ghcr.io/${GITHUB_REPOSITORY}-connector@${CONNECTOR_DIGEST}"
            echo '```'
            echo
            echo "The same connector library version is published as @zimme/bunny-hole on JSR. npm registry publication is deferred. Candidates are not stable releases."
            echo "The deployment archive includes the complete template and release.json with these exact image digests. Verify its GitHub artifact attestation before extraction."
          } > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          channel_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            channel_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            dist/release/* \
            --verify-tag --title "Bunny Hole $RELEASE_TAG" \
            --notes-file release-notes.md "${channel_flags[@]}"
      - name: Tear down release validation environment
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --profile development down --volumes --remove-orphans
          fi
