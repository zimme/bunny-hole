name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - ".devcontainer/**"
      - ".dockerignore"
      - "compose.yaml"
      - "deno.json"
      - "deno.lock"
      - "deno.runtime.json"
      - "deno.runtime.lock"

# The Dev Container Dockerfile is generated outside the checkout. Use Compose
# directly so Bake does not reject those generated paths.
env:
  COMPOSE_BAKE: "false"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rootlesskit-apparmor
      - name: Initialize Compose workspace
        run: sh .devcontainer/initialize.sh
      - name: Prepare the shared Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          BUNNY_HOLE_ENVIRONMENT_NAME: copilot
        with:
          configFile: .devcontainer/devcontainer.json
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer:cache
          push: never
          env: |
            CI
            BUNNY_HOLE_ENVIRONMENT_NAME
          runCmd: deno ci
      - name: Diagnose Dev Container startup
        if: failure()
        run: bash .devcontainer/diagnose.sh
