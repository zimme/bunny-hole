name: Deploy released image to Bunny

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing increasing ComVer release tag (MAJOR.MINOR.0)
        required: true
        type: string
      digest:
        description: Published sha256 image digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate immutable release input
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.0$ ]] || exit 1
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the version tag resolves to the supplied digest
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}-host
        run: |
          actual="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${VERSION}" --format '{{.Manifest.Digest}}')"
          test "$actual" = "$DIGEST" || {
            echo "The release tag does not resolve to the supplied digest" >&2
            exit 1
          }
          docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" >/dev/null
      - name: Update the configured Magic Container
        uses: BunnyWay/actions/container-update-image@4b22fe0b319386b3913117daf97729409dd0a6ef
        with:
          app_id: ${{ vars.BUNNY_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: ${{ vars.BUNNY_CONTAINER_NAME }}
          image_name: ghcr.io/${{ github.repository }}-host
          image_tag: ${{ inputs.version }}
          image_digest: ${{ inputs.digest }}
