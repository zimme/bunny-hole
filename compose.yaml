name: bunny-hole

networks:
  tunnel:
    ipam:
      config:
        - subnet: 10.253.240.0/24

services:
  relay:
    build:
      context: .
      target: relay-runtime
    environment:
      BUNNY_HOLE_LOCAL_DEVELOPMENT: "true"
      BUNNY_HOLE_TUNNELS: >-
        [{"id":"integration","secret":"${BUNNY_HOLE_TEST_SECRET:?set by integration runner}","hostnames":["tunnel.test","127.0.0.1","host.docker.internal"]}]
    networks:
      - tunnel
    ports:
      - "${BUNNY_HOLE_BIND_ADDRESS:-127.0.0.1}:18080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/relay", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 20

  origin:
    build:
      context: .
      target: fixture-runtime
    networks:
      - tunnel
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  connector:
    build:
      context: .
      target: connector-runtime
    depends_on:
      relay:
        condition: service_started
      origin:
        condition: service_started
    environment:
      BUNNY_HOLE_ALLOW_PRIVATE_NETWORK: "true"
      BUNNY_HOLE_LOCAL_DEVELOPMENT: "true"
      BUNNY_HOLE_LOG_FORMAT: pretty
      BUNNY_HOLE_ORIGIN: http://origin:3000
      BUNNY_HOLE_RELAY_URL: ws://relay:8080
      BUNNY_HOLE_TUNNEL_ID: integration
      BUNNY_HOLE_TUNNEL_SECRET: ${BUNNY_HOLE_TEST_SECRET:?set by integration runner}
    networks:
      - tunnel
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
