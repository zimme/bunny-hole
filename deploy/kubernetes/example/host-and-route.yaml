apiVersion: bunny-hole.dev/v1alpha1
kind: BunnyHoleHost
metadata:
  name: home
  namespace: bunny-hole-system
spec:
  url: https://hole.example.com
  transport: wss
  credentialsSecretRef:
    name: bunny-hole-home-credentials
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: home
  annotations:
    bunny-hole.dev/host: bunny-hole-system/home
spec:
  gatewayClassName: bunny-hole
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: home.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home
spec:
  parentRefs:
    - name: public
  hostnames: [home.example.com]
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
