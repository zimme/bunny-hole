apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-hole-controller
  namespace: bunny-hole-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bunny-hole-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bunny-hole-controller
    spec:
      serviceAccountName: bunny-hole-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/zimme/bunny-hole-connector@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          args: [operator]
          env:
            - name: BUNNY_HOLE_CREDENTIALS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
