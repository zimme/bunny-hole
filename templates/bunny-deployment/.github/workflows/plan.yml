name: Plan deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select bootstrap for the first host plan or apply for the full reviewed plan
        required: true
        default: apply
        type: choice
        options: [bootstrap, apply]

concurrency:
  group: bunny-hole-terraform-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Verify private setup is complete
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: bash scripts/verify-inputs.sh

      - name: Initialize remote state
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: terraform -chdir=terraform init -input=false -lockfile=readonly
      - name: Produce a reviewable plan
        shell: bash
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          OPERATION: ${{ inputs.operation }}
        run: bash scripts/deployment.sh plan
