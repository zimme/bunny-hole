name: Check deployment

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".terraform-version"
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".terraform-version"
      - "terraform/**"
  workflow_dispatch:

concurrency:
  group: deployment-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize without a state backend
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform -chdir=terraform validate -no-color
      - name: Reject generated or secret-bearing files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.tfstate*' -o -name '*.tfplan' -o -name 'crash.*.log' \) -print -quit | grep -q .; then
            echo 'Terraform state, plans, and crash logs must not be committed.' >&2
            exit 1
          fi
          if git grep -nE '(BEGIN (EC |OPENSSH |RSA )?PRIVATE KEY|gh[opsu]_[A-Za-z0-9]{20,}|BUNNYNET_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,})' -- ':!*.md'; then
            echo 'Likely credential material is present.' >&2
            exit 1
          fi
