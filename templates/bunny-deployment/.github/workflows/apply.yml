name: Apply deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bootstrap adopts generated Pull Zones; apply converges reviewed infrastructure
        required: true
        type: choice
        options: [bootstrap, apply]
      confirmation:
        description: Enter BOOTSTRAP or APPLY to match the selected operation
        required: true
        type: string
      reviewed_commit:
        description: Exact 40-character commit SHA printed by Plan deployment
        required: true
        type: string
      reviewed_plan_sha256:
        description: Canonical SHA-256 printed by Plan deployment
        required: true
        type: string

concurrency:
  group: bunny-hole-terraform-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      ((inputs.operation == 'bootstrap' && inputs.confirmation == 'BOOTSTRAP') ||
       (inputs.operation == 'apply' && inputs.confirmation == 'APPLY'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify reviewed commit is still the default-branch tip
        # This is a point-in-time guard, not an atomic lock on the default branch.
        # Keep the protected approval and apply window free of new default-branch pushes.
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: bash scripts/verify-tip.sh

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Verify private setup is complete
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: bash scripts/verify-inputs.sh

      - name: Initialize remote state
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: terraform -chdir=terraform init -input=false -lockfile=readonly
      - name: Apply reviewed deployment
        shell: bash
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          OPERATION: ${{ inputs.operation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
        run: bash scripts/deployment.sh apply
